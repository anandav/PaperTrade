name: Deploy Client to Azure Static Web Apps

on:
  push:
    branches:
      - master
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          fetch-depth: 0

      # Azure SWA builds under app_location without reliable git/tags access.
      # Resolve Tag+SHA version here (where git works) and pass APP_VERSION into the build.
      - name: Resolve app version
        id: version
        run: |
          set -e
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            BASE="${TAG#v}"
            COUNT=$(git rev-list "${TAG}"..HEAD --count)
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + COUNT))"
          else
            VERSION=$(node -p "require('./client/package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=v${VERSION} (tag=${TAG:-none}, sha=${GITHUB_SHA:0:7})"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_HILL_05D829200 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./client" # App source code path
          api_location: "" # No API - using separate Container App for backend
          output_location: "dist" # Built app content directory - optional
          app_build_command: "npm install && npm run build"
          ###### End of Repository/Build Configurations ######
        env:
          API_URL: ${{ secrets.API_URL_SECRET }}
          BUILD_SHA: ${{ github.sha }}
          APP_VERSION: ${{ steps.version.outputs.version }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_HILL_05D829200 }}
          action: "close"

